name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip
      - name: Créer un rôle non super-utilisateur (RLS)
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE ROLE cousp LOGIN PASSWORD 'cousp_dev_password' NOSUPERUSER;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE cousp_task_test OWNER cousp;"
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: php artisan test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # Vérifie que la démonstration Docker (docker-compose.demo.yml) démarre et qu'on peut se connecter.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Démarrer la démonstration
        run: docker compose -f docker-compose.demo.yml up -d --build --wait --wait-timeout 600
      - name: Connexion par le web et par l'API
        run: |
          curl -fsS http://localhost:8080/up >/dev/null
          curl -fsS http://localhost:8080/login >/dev/null
          curl -fsS -X POST http://localhost:8080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"coordonnateur@cousp.local","password":"Cousp@2026!"}' -c cookies.txt | grep -q '"success":true'
          curl -fsS http://localhost:8080/api/proxy/tasks -b cookies.txt | grep -q '"success":true'
          curl -fsS "http://localhost:8080/api/download/reports/tasks?format=pdf" -b cookies.txt -o rapport.pdf
          head -c 4 rapport.pdf | grep -q '%PDF'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose -f docker-compose.demo.yml logs --tail=200
