# Appels publics vers l'API Laravel (php-fpm). Toute requête passe par public/index.php,
# Nginx n'a donc besoin d'aucun fichier de l'API.
include fastcgi_params;
fastcgi_pass api:9000;
fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
fastcgi_param SCRIPT_NAME /index.php;
fastcgi_param HTTPS on;
# Un appel public ne peut pas annoncer une autre adresse IP que la sienne.
fastcgi_param HTTP_X_FORWARDED_FOR "";
fastcgi_read_timeout 120s;
