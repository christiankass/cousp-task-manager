# Démonstration locale : tout passe par http://localhost:8080
#   /        → application web
#   /api/v1/ → API (aussi utilisée par l'application mobile) ; les autres /api/ sont ceux du web
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    location /api/v1/ {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_read_timeout 120s;
    }
    location = /up {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}

# Entrée interne utilisée par le serveur web pour joindre l'API.
server {
    listen 8081;
    location / {
        include fastcgi_params;
        fastcgi_pass api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 120s;
    }
}
